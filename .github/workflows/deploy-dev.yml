name: Deploy to Dev

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'rules/**'
      - '.claude/**'
  workflow_dispatch:

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Firebase Hosting を dev へデプロイ
    needs: test
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - name: チェックアウト
        uses: actions/checkout@v7
      - name: Node.js を用意する
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - name: 依存関係をインストールする
        run: npm ci
      - name: Google Cloud に認証する
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - name: ビルドする
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
        run: npm run build
      - name: Firebase にデプロイする
        run: npx firebase-tools deploy --only hosting --project ${{ vars.FIREBASE_PROJECT_ID }}

  # カバレッジはマージ時点の状態として公開する (テストが走るのはこのマージ実行のみ)
  publish-coverage:
    name: カバレッジを GitHub Pages へ公開する
    needs: test
    runs-on: ubicloud-standard-2
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: カバレッジレポートを取得する
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: _site/coverage
      - name: Pages 用の成果物を保存する
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: GitHub Pages へ公開する
        id: deployment
        uses: actions/deploy-pages@v5
