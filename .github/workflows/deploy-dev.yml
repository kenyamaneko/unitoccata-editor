name: Deploy to Dev

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'rules/**'
      - '.claude/**'
  workflow_dispatch:

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: CI
    uses: ./.github/workflows/ci.yml

  determine-version:
    name: バージョンの判定
    runs-on: ubicloud-standard-2
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: チェックアウト
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Git タグからバージョンを求める
        id: version
        run: |
          VERSION=$(git describe --tags --always)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Detected version: ${VERSION}"

  deploy:
    name: Firebase Hosting を dev へデプロイ
    needs: [test, determine-version]
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - name: チェックアウト
        uses: actions/checkout@v7
      - name: Node.js を用意する
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - name: 依存関係をインストールする
        run: npm ci
      - name: Google Cloud に認証する
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - name: ビルドする
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          VITE_BUILD_VERSION: ${{ needs.determine-version.outputs.version }}
        run: npm run build
      - name: Firebase にデプロイする
        run: npx firebase-tools deploy --only hosting --project ${{ vars.FIREBASE_PROJECT_ID }}

  smoke:
    name: デプロイ後のスモークテスト (dev)
    needs: deploy
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    environment: dev
    steps:
      - name: チェックアウト
        uses: actions/checkout@v7
      - name: Node.js を用意する
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - name: 依存関係をインストールする
        run: npm ci
      - name: Playwright のブラウザを入れる
        run: npx playwright install --with-deps chromium
      - name: スモークテストを実行する
        env:
          SMOKE_BASE_URL: https://${{ vars.FIREBASE_PROJECT_ID }}.web.app
          SMOKE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          SMOKE_FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
        run: npm run test:smoke

  # テスト観点カタログ・カバレッジはマージ時点の状態として公開する (テストが走るのはこのマージ実行のみ)
  publish-reports:
    name: テスト観点カタログとカバレッジを GitHub Pages へ公開する
    needs: test
    runs-on: ubicloud-standard-2
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: チェックアウト
        uses: actions/checkout@v7
      - name: Python を用意する
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: JUnit XML を取得する
        uses: actions/download-artifact@v8
        with:
          pattern: junit-*
          path: junit-artifacts
      # カバレッジページとは別ページにするため、既存 URL に影響しないルート直下に生成する。
      - name: テスト観点カタログを生成する
        run: |
          mkdir -p _site
          python scripts/generate_behavior_catalog.py \
            --format html \
            --commit "${GITHUB_SHA}" \
            --section "外から見た振る舞い:全テスト:junit-artifacts/junit-vitest/vitest-junit.xml" \
            --section "外から見た振る舞い:E2E:junit-artifacts/junit-e2e/e2e-junit.xml" \
            > _site/index.html
      - name: カバレッジレポートを取得する
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: _site/coverage
      - name: Pages 用の成果物を保存する
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: GitHub Pages へ公開する
        id: deployment
        uses: actions/deploy-pages@v5
