name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 変更判定
    runs-on: ubicloud-standard-2
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: チェックアウト
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: ドキュメント以外の変更の有無を判定する
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" "$GITHUB_SHA" | grep -vE '^docs/|\.md$' | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    steps:
      - name: チェックアウト
        uses: actions/checkout@v7
      - name: Node.js を用意する
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - name: 依存関係をインストールする
        run: npm ci
      - name: lint を実行する
        run: npm run lint

  typecheck:
    name: typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    steps:
      - name: チェックアウト
        uses: actions/checkout@v7
      - name: Node.js を用意する
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - name: 依存関係をインストールする
        run: npm ci
      - name: 型チェックを実行する
        run: npm run typecheck

  test:
    name: test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    steps:
      - name: チェックアウト
        uses: actions/checkout@v7
      - name: Node.js を用意する
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - name: Java を用意する
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: 21
      - name: 依存関係をインストールする
        run: npm ci
      - name: テストを実行する (カバレッジを測る)
        run: npm run test:coverage
      # 同一 run 内でカバレッジページを組むためだけに使うので保持は最短にする。
      - name: カバレッジレポートを保存する
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
          retention-days: 1
      - name: Python を用意する
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: カタログ生成スクリプトのテストを実行する
        run: |
          pip install pytest
          python -m pytest scripts
      # 同一 run 内でテスト観点カタログを組むためだけに使うので保持は最短にする。
      - name: JUnit XML を保存する
        uses: actions/upload-artifact@v7
        with:
          name: junit-vitest
          path: test-results/vitest-junit.xml
          retention-days: 1

  e2e:
    name: e2e
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubicloud-standard-2
    timeout-minutes: 20
    steps:
      - name: チェックアウト
        uses: actions/checkout@v7
      - name: Node.js を用意する
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - name: Java を用意する
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: 21
      - name: 依存関係をインストールする
        run: npm ci
      - name: Playwright のブラウザを入れる
        run: npx playwright install --with-deps chromium
      - name: E2E テストを実行する
        run: npm run test:e2e
      # 同一 run 内でテスト観点カタログを組むためだけに使うので保持は最短にする。
      - name: JUnit XML を保存する
        uses: actions/upload-artifact@v7
        with:
          name: junit-e2e
          path: test-results/e2e-junit.xml
          retention-days: 1
      - name: E2E テストの失敗の記録を保存する
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure
          path: test-results
          retention-days: 7

  build:
    name: build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    steps:
      - name: チェックアウト
        uses: actions/checkout@v7
      - name: Node.js を用意する
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - name: 依存関係をインストールする
        run: npm ci
      - name: ビルドを実行する
        run: npm run build
